<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣手語學習遊戲 - Web 版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        #canvas { display: block; width: 100vw; height: 100vh; z-index: 0; }

        .center-state {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; padding: 20px 40px; background-color: #0f0; color: #000;
            border-radius: 12px; border: none; font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4); z-index: 1000; cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 🌟 R1: 瞬間出現無飄移的暫停按鈕 */
        .center-state-instant {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; padding: 20px 40px; background-color: #0f0; color: #000;
            border-radius: 12px; border: none; font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4); z-index: 1000; cursor: pointer;
            transition: none; 
        }
        
        .top-left-state {
            position: absolute; top: 20px; left: 20px; transform: none; 
            font-size: 18px; padding: 10px 20px; background-color: #ffaa00; color: #000;
            border-radius: 5px; border: none; font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5); z-index: 1000; cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
    </style>
</head>

<body>
    <div id="introUI" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;">
        <div id="typewriterText" style="color: #0f0; font-size: 24px; font-family: monospace; max-width: 600px; line-height: 1.6; min-height: 150px; text-align: left;"></div>
        <button id="skipIntroBtn" style="margin-top: 40px; padding: 10px 20px; font-size: 16px; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer;">略過動畫</button>
    </div>

    <div id="musicSelectionUI" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; text-align: center;">
        <div style="background: #111; padding: 40px; border-radius: 15px; border: 2px solid #0f0; box-shadow: 0 0 30px rgba(0,255,0,0.3); max-width: 400px; width: 90%;">
            <h2 style="color: #fff; margin-bottom: 30px; letter-spacing: 2px;">準備開始遊戲</h2>
            
            <div style="margin-bottom: 25px;">
                <label for="audioUpload" style="display: inline-block; padding: 12px 24px; background: #333; color: #0f0; border-radius: 8px; cursor: pointer; border: 1px dashed #0f0; transition: 0.3s; width: 100%; box-sizing: border-box; font-weight: bold;">
                    📁 選擇本地音樂 (.mp3 / .wav)
                </label>
                <input type="file" id="audioUpload" accept="audio/*, audio/mp3, audio/wav, audio/mpeg, .mp3, .wav, .m4a, .aac" style="display: none;">
            </div>

            <p style="color: #666; margin: 15px 0;">— 或者 —</p>

            <button id="defaultMusicBtn" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background: #0f0; color: #000; border: none; border-radius: 8px; font-weight: bold; width: 100%; transition: 0.3s;">
                🎧 使用預設音樂試玩
            </button>

            <p id="parsingStatus" style="color: #0f0; margin-top: 20px; font-size: 14px; min-height: 20px;"></p>
        </div>
    </div>

    <button id="actionBtn" class="center-state" style="display: none;">開始遊戲</button>

    <div id="ui" style="position: absolute; top: 80px; left: 20px; color: white; text-shadow: 1px 1px 2px black; z-index: 100; pointer-events: none;">
        <div id="ui-row" style="pointer-events: auto; margin-bottom: 10px;">
            <select id="difficulty-select" style="font-size: 14px; padding: 4px; background: #333; color: #fff; border: 1px solid #777; border-radius: 4px; outline: none; cursor: pointer;">
                <option value="all">所有難度</option>
                <option value="1">等級 1 (簡單)</option>
                <option value="2">等級 2 (中等)</option>
                <option value="3">等級 3 (困難)</option>
            </select>
        </div>
        <p id="status" style="margin: 5px 0;">狀態: 準備中</p>
        <p id="score" style="margin: 5px 0;">房子數: 10</p>
        <p id="life" style="margin: 5px 0;">已掉落: 0/15</p>
        <p id="gesture" style="margin: 5px 0; color: #0f0;">偵測: 無</p>
        <p id="progress" style="margin: 5px 0;">進度: 等待手勢...</p>
    </div>

    <canvas id="canvas" width="600" height="800"></canvas>
    <video id="video" autoplay playsinline muted style="display: none;"></video>
    <audio id="bgmPlayer" crossorigin="anonymous" style="display: none;"></audio>

    <div id="namePromptUI" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; justify-content: center; align-items: center;">
        <div style="background: #222; padding: 40px; border-radius: 15px; border: 2px solid #0f0; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.3);">
            <h2 id="promptMessage" style="color: #fff; margin-top: 0; margin-bottom: 20px;"></h2>
            <input type="text" id="playerNameInput" placeholder="請輸入大名" value="神秘玩家" style="padding: 12px; font-size: 18px; width: 80%; margin-bottom: 30px; text-align: center; border-radius: 8px; border: none; outline: none;">
            <br>
            <button id="submitNameBtn" style="padding: 12px 30px; font-size: 18px; background: #0f0; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">送出分數</button>
            <button id="cancelNameBtn" style="padding: 12px 30px; font-size: 18px; background: #555; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-left: 15px;">不留名並返回</button>
        </div>
    </div>

    <div id="customAlertUI" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 5000; justify-content: center; align-items: center;">
        <div style="background: #222; padding: 30px; border-radius: 10px; border: 2px solid #f00; text-align: center; max-width: 400px;">
            <h3 id="alertMessage" style="color: #fff; margin-top: 0; line-height: 1.5;"></h3>
            <button id="closeAlertBtn" style="padding: 10px 30px; font-size: 16px; background: #f00; color: #fff; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">確定</button>
        </div>
    </div>

    <div id="leaderboard-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
        <div style="background: #111; padding: 30px; border-radius: 15px; border: 3px solid #0f0; width: 85%; max-width: 400px; text-align: center; color: white; box-shadow: 0 0 20px rgba(0,255,0,0.5);">
            <h2 style="color: #0f0; margin-top: 0; font-size: 28px;">🌍 全球排行榜 🌍</h2>
            <ul id="leaderboard-list" style="list-style: none; padding: 0; margin: 20px 0; max-height: 300px; overflow-y: auto;"></ul>
            <button id="close-leaderboard-btn" style="padding: 12px 24px; font-size: 18px; cursor: pointer; background: #0f0; color: #000; border: none; border-radius: 8px; font-weight: bold; width: 100%;">
                關閉排行榜
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="holistic_features.js?v=20260413"></script>
    <script type="module" src="app.js?v=999999"></script>
</body>
</html>
